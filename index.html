<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заявка на выезд</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Заявка на выезд</h1>
    <p class="lead">Заполните форму: куда или к кому вы едете и на какие даты.</p>

    <form id="trip-form" novalidate>
      <label class="field">
        <span>Ваше имя</span>
        <input type="text" name="name" required maxlength="100" autocomplete="name">
      </label>

      <label class="field">
        <span>Куда / к кому едете</span>
        <input type="text" name="destination" required maxlength="200">
      </label>

      <div class="row">
        <label class="field">
          <span>С</span>
          <input type="date" name="from" required>
        </label>
        <label class="field">
          <span>По</span>
          <input type="date" name="to" required>
        </label>
      </div>

      <label class="field">
        <span>Комментарий <em>(необязательно)</em></span>
        <textarea name="comment" rows="3" maxlength="500"></textarea>
      </label>

      <!-- Скрытое поле-ловушка для ботов: люди его не видят и не заполняют -->
      <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

      <button type="submit" id="submit-btn">Отправить</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
